workflows:
  ios-build:
    name: Rocket Odyssey Pro iOS Build
    max_build_duration: 60
    environment:
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.rocketodyssey.pro"
      node: 20.11.0
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Build Web Assets
        script: |
          # No build step needed - static HTML
          echo "Static HTML game - no build required"
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set up code signing
        script: |
          # Codemagic manages code signing automatically
          echo "Code signing handled by Codemagic"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --auto-sign \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ayhanhasani33@gmail.com
