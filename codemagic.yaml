workflows:
  ios-build:
    name: Rocket Odyssey Pro iOS Build
    max_build_duration: 60
    environment:
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.rocketodyssey.pro"
      node: 20.11.0
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Build Web Assets
        script: |
          echo "Static HTML game - no build required"
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build
        script: |
          cd ios/App
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
